name: MAINNET locked readiness fixtures

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-regtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install validation dependencies
        run: sudo apt-get update && sudo apt-get install --yes ninja-build clang-18 libgtest-dev libsecp256k1-dev libssl-dev
      - name: Compare offline REGTEST corpus across O0, O2 and O3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p readiness-results
          for config in debug release o3; do
            case "$config" in
              debug) type=Debug; flags=-O0 ;;
              release) type=Release; flags=-O2 ;;
              o3) type=Release; flags=-O3 ;;
            esac
            CC=clang-18 CXX=clang++-18 cmake -S . -B "build/$config" -G Ninja \
              -DCMAKE_BUILD_TYPE="$type" -DCMAKE_CXX_FLAGS="$flags" \
              -DCMAKE_CXX_FLAGS_RELEASE="$flags -DNDEBUG"
            cmake --build "build/$config" --parallel 2 --target nova_readiness_vectors novacoind
            "build/$config/tests/nova_readiness_vectors" > "readiness-results/$config.txt"
            ctest --test-dir "build/$config" --output-on-failure -R 'nova.(mainnet_lock|readiness_policy|readiness_vectors)$'
          done
          diff -u readiness-results/debug.txt readiness-results/release.txt
          diff -u readiness-results/debug.txt readiness-results/o3.txt
          python3 -B scripts/check_mainnet_readiness.py > readiness-results/gates.json
          if python3 -B scripts/check_mainnet_readiness.py --activation-check; then
            echo 'ERROR: activation must remain forbidden' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: locked-mainnet-readiness-fixtures
          path: readiness-results
          if-no-files-found: warn
          retention-days: 30
